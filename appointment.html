<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Appointment | Agarwal Eye Care Centre</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        :root {
            --brand-cyan: #00b4d8;
            --brand-glow: rgba(0, 180, 216, 0.3);
            --bg-deep: #060810;
            --card-glass: #111422;
            --text-pure: #ffffff;
            --text-muted: #64748b;
            --neon-green: #10b981;
            --neon-amber: #f59e0b;
        }
        body { 
            background: radial-gradient(circle at center, #101528 0%, var(--bg-deep) 100%); 
            color: var(--text-pure); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 30px 20px;
            overflow-x: hidden;
        }
        .appointment-master-card { 
            max-width: 550px; 
            width: 100%; 
            background: var(--card-glass); 
            border-radius: 32px; 
            padding: 40px; 
            border: 1px solid rgba(0, 180, 216, 0.15); 
            box-shadow: 0 30px 70px rgba(0,0,0,0.7);
        }
        .clinic-header-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--brand-cyan);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
        }
        .live-status-board {
            background: linear-gradient(135deg, #1c150e 0%, #120e0a 100%);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }
        .board-pulse {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--neon-amber);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .pulse-dot-amber {
            width: 7px;
            height: 7px;
            background: var(--neon-amber);
            border-radius: 50%;
            display: inline-block;
            animation: pulseGlow 1.4s infinite;
        }
        .live-counter-row { display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
        .counter-item span { font-size: 11px; color: var(--text-muted); display: block; font-weight: 600; }
        .counter-item strong { font-size: 28px; color: var(--neon-amber); font-weight: 800; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .input-control { 
            width: 100%; padding: 15px 18px; background: #090b11; border: 1px solid rgba(255,255,255,0.06); 
            color: white; border-radius: 14px; outline: none; font-size: 14px; font-weight: 500; 
        }
        .input-control:focus { border-color: var(--brand-cyan); }
        .flex-row { display: grid; grid-template-columns: 1fr 1.2fr; gap: 15px; }
        .gender-chips-container { display: flex; gap: 8px; }
        .gender-chip {
            flex: 1; background: #090b11; border: 1px solid rgba(255,255,255,0.06); color: var(--text-pure);
            padding: 14px 0; text-align: center; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .gender-chip.active { background: rgba(0, 180, 216, 0.15); border-color: var(--brand-cyan); color: var(--brand-cyan); }
        .btn-confirm-booking { 
            width: 100%; background: var(--brand-cyan); color: #000; border: none; padding: 16px; 
            border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; gap: 10px; margin-top: 10px; box-shadow: 0 10px 30px rgba(0,0,b4,0.25);
        }
        .back-home-link { display: block; margin-top: 20px; font-size: 13px; color: var(--text-muted); text-decoration: none; text-align: center; }
        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.5; }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="appointment-master-card">
        <div class="clinic-header-badge"><i class="fas fa-eye"></i> Agarwal Eye Care Centre</div>

        <div class="live-status-board">
            <div class="board-pulse"><span class="pulse-dot-amber"></span> Live Clinic Status Board</div>
            <div class="live-counter-row">
                <div class="counter-item"><span>Current Active Token</span><strong id="live-board-active">#--</strong></div>
                <div style="width: 1px; height: 35px; background: rgba(255,255,255,0.08);"></div>
                <div class="counter-item"><span>Up Next In Line</span><strong id="live-board-next" style="color: var(--brand-cyan);">#01</strong></div>
            </div>
        </div>

        <form id="secure-appointment-form">
            <div class="form-group">
                <label>Select Doctor Practice Location</label>
                <select class="input-control" id="form-branch">
                    <option value="Kidwai Nagar Clinic">Agarwal Eye Care Centre (Kidwai Nagar)</option>
                    <option value="Evening Practice Hub">Branch 2 (Evening Practice Care)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Patient Full Name</label>
                <input type="text" id="form-name" class="input-control" placeholder="Enter full name" required>
            </div>
            <div class="form-group">
                <label>Active Mobile Number</label>
                <input type="tel" id="form-phone" class="input-control" placeholder="Enter 10-digit number" required>
            </div>
            <div class="flex-row">
                <div class="form-group">
                    <label>Patient Age</label>
                    <input type="number" id="form-age" class="input-control" placeholder="e.g., 25" required>
                </div>
                <div class="form-group">
                    <label>Select Gender</label>
                    <div class="gender-chips-container">
                        <div class="gender-chip active" data-value="Male">Male</div>
                        <div class="gender-chip" data-value="Female">Female</div>
                    </div>
                    <input type="hidden" id="form-gender" value="Male">
                </div>
            </div>
            <button type="submit" class="btn-confirm-booking"><i class="fas fa-lock"></i> Confirm & Book Appointment</button>
        </form>
        <a href="index.html" class="back-home-link"><i class="fas fa-arrow-left"></i> Back to Doctor Profile</a>
    </div>

    <audio id="success-buzzer" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-84.wav" preload="auto"></audio>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const genderChips = document.querySelectorAll(".gender-chip");
            const hiddenGenderInput = document.getElementById("form-gender");
            const appointmentForm = document.getElementById("secure-appointment-form");
            const successBuzzer = document.getElementById("success-buzzer");

            setInterval(() => {
                const cachedToken = localStorage.getItem("doctorActiveToken") || "#--";
                const totalIssued = parseInt(localStorage.getItem("backendTotalIssued") || "0");
                document.getElementById("live-board-active").innerText = cachedToken;
                let nextNum = totalIssued + 1;
                document.getElementById("live-board-next").innerText = `#${nextNum < 10 ? '0' + nextNum : nextNum}`;
            }, 1000);

            genderChips.forEach(chip => {
                chip.addEventListener("click", () => {
                    document.querySelector(".gender-chip.active").classList.remove("active");
                    chip.classList.add("active");
                    hiddenGenderInput.value = chip.getAttribute("data-value");
                });
            });

            appointmentForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const name = document.getElementById("form-name").value;
                const phone = document.getElementById("form-phone").value;
                const age = document.getElementById("form-age").value;
                const gender = hiddenGenderInput.value;
                const location = document.getElementById("form-branch").value;

                let currentTotalIssued = parseInt(localStorage.getItem("backendTotalIssued") || "0");
                currentTotalIssued++;
                let generatedID = currentTotalIssued < 10 ? `#0${currentTotalIssued}` : `#${currentTotalIssued}`;

                let sharedQueue = JSON.parse(localStorage.getItem("demoPatientQueue")) || [];
                sharedQueue.push({ token: generatedID, name: name });
                localStorage.setItem("demoPatientQueue", JSON.stringify(sharedQueue));
                localStorage.setItem("backendTotalIssued", currentTotalIssued.toString());

                successBuzzer.currentTime = 0;
                successBuzzer.play().catch(() => {});

                alert(`🎉 APPOINTMENT BOOKED!\nYour ID is: ${generatedID}\nPatient Name: ${name}`);

                document.getElementById("form-name").value = "";
                document.getElementById("form-phone").value = "";
                document.getElementById("form-age").value = "";
            });
        });
    </script>
</body>
</html>
